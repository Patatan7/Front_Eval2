version: '3.8'

services:
  frontend:
    build: .
    container_name: frontend-innovatech
    restart: always
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - DEBUG=False
      - BACKEND_URL=${BACKEND_URL}
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - .env
    networks:
      - innovatech-network

networks:
  innovatech-network:
    driver: bridge